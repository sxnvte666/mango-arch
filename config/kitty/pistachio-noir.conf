# Pistachio Noir for kitty
# Save as ~/.config/kitty/pistachio-noir.conf and add this line to kitty.conf:
#   include pistachio-noir.conf
# (or run: kitten themes --reload-in=all, then pick it from a custom theme)

# base
foreground              #E5E9D8
background              #15170F
selection_foreground    #15170F
selection_background    #9FD88A
cursor                  #9FD88A
cursor_text_color       #15170F
url_color               #9FD88A

# window borders and bell
active_border_color     #39412A
inactive_border_color   #2A2F1F
bell_border_color       #E0B15E

# tab bar
tab_bar_background      #15170F
active_tab_foreground   #9FD88A
active_tab_background   #1D2016
inactive_tab_foreground #626F51
inactive_tab_background #15170F

# search / mark highlights
mark1_foreground        #15170F
mark1_background        #9FD88A
mark2_foreground        #15170F
mark2_background        #E0B15E
mark3_foreground        #15170F
mark3_background        #AC8ED0

## regular (0-7)
color0   #1D2016   # black
color1   #DB8267   # red
color2   #9FD88A   # green
color3   #E0B15E   # yellow
color4   #7DA3B3   # blue
color5   #AC8ED0   # magenta
color6   #7FC9A8   # cyan
color7   #E5E9D8   # white

## bright (8-15)
color8   #626F51   # bright black
color9   #DB8267   # bright red
color10  #9FD88A   # bright green
color11  #E0B15E   # bright yellow
color12  #7DA3B3   # bright blue
color13  #AC8ED0   # bright magenta
color14  #7FC9A8   # bright cyan
color15  #F6F8EF   # bright white
