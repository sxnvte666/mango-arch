general {
    no_fade_in = false              # Enable smooth fade-in animation
    grace = 0                       # Grace period before requiring password
    disable_loading_bar = false     # Show loading indicator
}

background {
    monitor =
    path = ~/Pictures/wallpaper.png
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.3
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba(216, 222, 233, 0.90)
    font_size = 120
    font_family = JetBrainsMono Nerd Propo
    position = 0, 230
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 55
    outline_thickness = 2
    dots_size = 0.2                 # Password dot size (0.2-0.8)
    dots_spacing = 0.2              # Spacing between dots (0.0-1.0)
    dots_center = false              # Center dots in field
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Propo
    placeholder_text = <i><span foreground="##ffffff99">Enter Pass</span></i>
    hide_input = false              # Show/hide password dots
    position = 0, 0
    halign = center
    valign = center
    rounding = 0
}

