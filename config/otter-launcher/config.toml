# [[modules]]
# description = "desktop programs"
# prefix = "app"
# cmd = "fsel"

[[modules]]
description = "search apps with fsel"
prefix = "apps"
cmd = "fsel -vv -d -r -ss \"{}\""
with_argument = true

[[modules]]
description = "launch apps instantly"
prefix = "app"
cmd = "fsel -vv -d -r -p \"{}\""
with_argument = true

[[modules]]
description = "edit dotfiles (nix)"
prefix = "nixdots"
cmd = "neovide ~/mango-arch/"
unbind_proc = true

[[modules]]
description = "edit dotfiles (.config)"
prefix = "dots"
cmd = "neovide ~/.config"
unbind_proc = true

[[modules]]
description = "audo mixer"
prefix = "mixer"
cmd = "wiremix"

[[modules]]
description = "power menu (fzf)"
prefix = "po"
cmd = """
function power {
if [[ -n $1 ]]; then
case $1 in
"logout") session=`loginctl session-status | head -n 1 | awk '{print $1}'`; loginctl terminate-session $session ;;
"suspend") systemctl suspend ;;
"hibernate") systemctl hibernate ;;
"reboot") systemctl reboot ;;
"shutdown") systemctl poweroff ;;
esac fi }
power $(echo -e 'reboot\nshutdown\nlogout\nsuspend\nhibernate' | fzf --info-command 'printf " power menu ($FZF_POS/$FZF_TOTAL_COUNT)"' --cycle --gutter " " --pointer " ▌" --color "bg+:-1,pointer:1,info:8,separator:8,scrollbar:0" --prompt '  ' | tail -1)
"""

[[modules]]
description = "mango keybinds (fzf)"
prefix = "kb"
cmd = "~/.config/otter-launcher/keybinds.sh"

[[modules]]
description = "run commands"
prefix = "sh"
cmd = """
$(printf $TERM | sed 's/xterm-//g') -e zsh -c "{}"
"""
with_argument = true
unbind_proc = true

[[modules]]
description = "search archwiki"
prefix = "aw"
cmd = "helium-browser https://wiki.archlinux.org/index.php?search='{}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "search packages"
prefix = "pkgs"
cmd = "helium-browser https://archlinux.org/packages/?q='{}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "search packages (pacseek)"
prefix = "pac"
cmd = "pacseek"

[[modules]]
description = "search the AUR"
prefix = "aur"
cmd = "helium-browser https://aur.archlinux.org/packages?K='{}'"
with_argument = true
url_encode = true
unbind_proc = true

[[modules]]
description = "open dirs (yazi)"
prefix = "yz"
cmd = """
find $HOME -type d -not -path '*/.cache/*' 2>/dev/null | fzf --info-command 'printf " directories ($FZF_POS/$FZF_TOTAL_COUNT)"' --cycle --gutter ' ' --pointer ' ▌' --color 'bg+:-1,pointer:1,info:8,separator:8,scrollbar:0' --prompt '  ' | xargs -r -I [] setsid -f "$(echo $TERM | sed 's/xterm-//g')" -e yazi '[]'
"""
